version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gestor-consulta-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gestor_consulta}
      MYSQL_USER: ${MYSQL_USER:-gestor_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gestor_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gestor-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:

networks:
  gestor-network:
    driver: bridge




